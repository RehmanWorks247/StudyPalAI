name: studypal
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studypal
      POSTGRES_USER: studypal
      POSTGRES_PASSWORD: studypal
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studypal -d studypal']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
